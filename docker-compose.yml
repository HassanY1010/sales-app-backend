version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mabe3at_backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      - DATABASE_URL=mysql://root:hhaall112233$@database:3306/business_manager
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql:8.0
    container_name: mabe3at_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: hhaall112233$$
      MYSQL_DATABASE: business_manager
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
